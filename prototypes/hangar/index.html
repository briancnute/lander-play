<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10191e">
<title>ASTRA · Craft workshop</title>
<link rel="stylesheet" href="./workshop.css?v=edit-design-1">
</head>
<body>
<header class="topbar">
 <nav class="editor-actions" aria-label="Craft editing">
  <button id="fleet-button" class="back-button">BACK</button><span class="toolbar-divider" aria-hidden="true"></span>
  <button id="save-button">SAVE</button><button id="save-as-button">SAVE AS</button><span class="toolbar-divider" aria-hidden="true"></span>
  <button id="undo-button" class="history-icon" aria-label="Undo" title="Undo" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4 3 9l5 5M3 9h10a7 7 0 0 1 0 14"/></svg></button><button id="redo-button" class="history-icon" aria-label="Redo" title="Redo" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m16 4 5 5-5 5m5-5H11a7 7 0 0 0 0 14"/></svg></button>
 </nav>
 <button id="save-close-button" class="save-active">SAVE AND CLOSE</button>
</header>
<main class="workshop">
  <section class="stage" aria-label="Live craft preview">
    <div class="stage-top"><div><button id="rename-button" class="craft-name" title="Rename craft"><span id="craft-name"></span><span class="edit-mark" aria-hidden="true">✎</span></button></div></div>
    <div class="drawing" id="drawing"></div>
    <div class="floor" aria-hidden="true"></div>
    <div class="stage-bottom"><span class="saved-state" id="saved-state"></span><button id="surprise-button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7 7h.01M17 7h.01M12 12h.01M7 17h.01M17 17h.01"/></svg> RANDOM</button></div>
    <div class="hint" id="preview-hint">Tap a part to explore it</div>
  </section>
  <section class="console" aria-label="Craft customization">
    <nav class="categories" aria-label="Craft parts" id="categories"></nav>
    <div class="shelf-heading"><div><h1 id="category-title">Cabin</h1></div><div class="shelf-tools"><button id="adjust-button" class="icon-button" aria-label="Adjust selected part" title="Adjust selected part" aria-pressed="false">⚙</button><button id="shuffle-button" class="icon-button" title="Try a random option in this category">Shuffle ↻</button></div></div>

    <div id="choices" class="choices" tabindex="0" aria-label="Cabin choices"></div>
    <div id="adjustments" class="adjustments" hidden></div>
    <div id="sticker-controls" class="sticker-controls" hidden></div>
    <div class="selection-line"><span id="selection-label"></span></div>
  </section>
</main>
<span id="message" class="editor-status" role="status" aria-live="polite"></span>
<dialog id="dialog"></dialog>
<script type="module" src="./workshop.js?v=edit-design-1"></script>
</body>
</html>
