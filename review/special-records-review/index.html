<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASTRA · Special records options</title><style>
:root{color-scheme:dark;--bg:#09131b;--panel:#12232d;--line:#314650;--ink:#e0ecec;--muted:#9cb0b9;--gold:#e8c783;--green:#a4daca}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#203541,var(--bg) 65%);color:var(--ink);font:15px system-ui,sans-serif;min-height:100vh;padding:22px 12px}button,select{font:inherit;color:inherit;background:#152832;border:1px solid var(--line);border-radius:7px;min-height:42px;padding:8px 12px;cursor:pointer}button:hover{border-color:var(--gold)}button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:3px}button[aria-pressed=true]{color:var(--gold);background:#39362c;border-color:#9b875d}.review{max-width:760px;margin:auto}.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase}h1{font-size:23px;margin:8px 0 14px}p{line-height:1.5;color:var(--muted)}.options{display:flex;gap:8px}.options button{flex:1}.explain{font-size:14px;min-height:44px;margin:12px 0 20px}.shell{max-width:560px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 20px 60px #0004}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.head h2{font-size:18px;margin:0}.head small{color:var(--muted);font-size:12px}.location{color:var(--muted);font-size:14px;margin:12px 0 4px}.game{font-size:18px;margin:0 0 14px}.tabs,.levels{display:flex;gap:6px;margin:12px 0}.tabs button{flex:1}.levels button{flex:1;min-height:40px}.caption{font-size:12px;color:var(--muted);margin:8px 0}.board-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.mini{background:#192d36;border:1px solid var(--line);border-radius:9px;padding:10px 8px;text-align:center}.mini h4{margin:0 0 7px;font-size:14px}.mini ol{list-style:none;padding:0;margin:0 0 6px}.mini li{padding:5px 0;font-size:22px;font-variant-numeric:tabular-nums}.rank{color:var(--muted);font-size:12px;margin-right:8px}.mini li:first-child strong{color:var(--gold)}.mini button{width:100%;font-size:12px;padding:5px;min-height:38px}.era-title{font-size:15px;margin:16px 0 9px}.bomb{display:flex;align-items:center;gap:12px;text-align:left}.bomb ol{display:flex;flex:1;justify-content:space-around;margin:0}.bomb button{width:auto}.bomb li{font-size:21px}.table-wrap{overflow-x:auto;margin:8px auto}table{border-collapse:collapse;table-layout:fixed;width:100%;font-size:14px;font-variant-numeric:tabular-nums}th{font-size:12px;font-weight:500;color:var(--muted);white-space:normal}td,th{text-align:center;padding:11px 4px;border-bottom:1px solid #30454e}td:first-child,th:first-child{border-right:2px solid #7c7154;width:23%}td:first-child{font-weight:650;color:var(--gold)}.best{background:#28514688;box-shadow:inset 0 -2px var(--green)}.scorebest{background:#62512d88;box-shadow:inset 0 -2px var(--gold)}details{margin:10px 0;font-size:13px}summary{cursor:pointer;min-height:40px;display:flex;align-items:center;color:var(--gold)}summary:before{content:'▸';margin-right:7px}details[open]>summary:before{content:'▾'}.extra{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:5px 0 12px}.extra div{background:#1d333d;padding:9px 4px;text-align:center;font-size:12px}.extra strong{display:block;font-size:14px;margin-top:5px}.history{margin-top:8px;width:100%;font-size:13px}.return{border:0;background:transparent;color:var(--gold);padding-left:0;font-size:13px}.empty{text-align:center;padding:30px 10px}.footer{display:flex;align-items:center;justify-content:space-between;margin-top:14px;border-top:1px solid var(--line);padding-top:12px;gap:8px}.footer span{font-size:12px;color:var(--muted)}.testing{max-width:560px;margin:18px auto;font-size:12px;color:var(--muted)}.testing label{display:block;margin:8px 0}.testing select{margin-left:6px;font-size:12px}.note{font-size:12px;margin:12px 0 0}.closed{text-align:center;padding:40px 10px}@media(max-width:420px){body{padding:14px 8px}.shell{padding:12px 10px}.head h2{font-size:17px}.options button{font-size:13px;padding:8px}.explain{font-size:13px}.tabs button{font-size:13px;padding:8px 5px}.bomb{gap:5px}.bomb li{font-size:19px}.rank{margin-right:4px}td,th{padding:10px 3px}table{font-size:13px}.mini{padding:9px 5px}}
</style></head><body><main class="review"><div class="eyebrow">ASTRA · Interactive design trial</div><h1>Mercury Special records</h1><nav class="options" aria-label="Design options"><button data-option="a">A · Game first</button><button data-option="b">B · All boards</button></nav><p id="explain" class="explain"></p><section id="app" class="shell" aria-label="Records preview"></section><div class="testing"><label>Open Records from <select id="entry"><option value="site">Destination preview</option><option value="medium">Present Day · Medium postcard</option><option value="bomb">Bombardment postcard</option></select></label><label><input type="checkbox" id="empty"> Try an empty scoreboard</label><p>Fictional records for this preview. No saved scores are read or changed.</p></div></main><script>
const $=s=>document.querySelector(s);let option='a',era='present',level='medium',detail=false,all=false,empty=false,closed=false;
const names={easy:'Easy',medium:'Medium',hard:'Hard',bomb:'Bombardment Era'};
const data={easy:[[100,68.2,5,0,0],[97,69.1,5,1,0],[94,70.4,5,2,0],[82,71.2,4,1,0]],medium:[[97,69.4,5,1,0],[94,70.3,5,2,0],[91,72.1,5,3,0],[79,73.2,4,2,0]],hard:[[94,71.8,5,2,0],[91,72.7,5,3,0],[88,74.1,5,4,0],[76,75.3,4,3,0]],bomb:[[92,72.5,5,0,1],[89,74.2,5,1,1],[84,75.1,5,0,2],[81,76.4,5,1,2]]};
function key(){return era==='bomb'?'bomb':level}function pick(k){era=k==='bomb'?'bomb':'present';if(k!=='bomb')level=k;detail=true;all=false;render()}
function mini(k){return `<div class="mini"><h4>${names[k]}</h4>${empty?'<p>—</p>':`<ol>${data[k].slice(0,3).map((r,i)=>`<li><span class="rank">${i+1}.</span><strong>${r[0]}</strong></li>`).join('')}</ol>`}<button data-pick="${k}" aria-label="View ${names[k]} stats">Stats →</button></div>`}
function board(){let rows=empty?[]:data[key()].slice(0,all?4:3);return `${option==='b'?'<button class="return" id="back">← All boards</button>':''}<div class="tabs" aria-label="Game">${[['present','Present Day'],['bomb','Bombardment Era']].map(([k,n])=>`<button data-era="${k}" aria-pressed="${era===k}">${n}</button>`).join('')}</div>${era==='present'?`<div class="levels" aria-label="Difficulty">${['easy','medium','hard'].map(k=>`<button data-level="${k}" aria-pressed="${level===k}">${names[k]}</button>`).join('')}</div>`:''}<p class="caption">${all?'All scores':'Top 3'} · ${era==='present'?'Present Day · '+names[level]:'Bombardment Era'}</p>${!rows.length?'<div class="empty">No scores yet<p>Your finished runs will appear here.</p></div>':`<div class="table-wrap"><table><thead><tr><th>Overall</th><th>Time</th><th>Samples</th><th>${era==='bomb'?'Impact hits':'Crater contacts'}</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td class="${i===0?'scorebest':''}">${r[0]}</td><td class="${i===0?'best':''}">${r[1].toFixed(1)} s</td><td class="best">${r[2]}</td><td class="${r[era==='bomb'?4:3]===Math.min(...rows.map(x=>x[era==='bomb'?4:3]))?'best':''}">${r[era==='bomb'?4:3]}</td></tr>`).join('')}</tbody></table></div><details><summary>More stats</summary>${rows.map((r,i)=>`<p class="caption">${i+1}. Score ${r[0]}</p><div class="extra"><div>Crater contacts<strong>${r[3]}</strong></div><div>Impact hits<strong>${r[4]}</strong></div><div>Date<strong>Oct ${12-i}, 2026</strong></div></div>`).join('')}</details><button class="history" id="history">${all?'Show top 3':'All scores · 4'}</button>`}`}
function render(){document.querySelectorAll('[data-option]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.option===option));$('#explain').textContent=option==='a'?'A · My recommendation: choose the game, then difficulty. One compact scoreboard stays in place; postcards open their exact board.':'B · See all four top threes at once, grouped by game. Open Stats for any board; postcards skip the overview.';$('#app').innerHTML=closed?'<div class="closed"><p>Returned to the caller</p><button id="reopen">Open Records</button></div>':`<header class="head"><h2>Records</h2><small>Example data</small></header><p class="location">Mercury — Terminator Zone</p><h3 class="game">Terminator Run</h3>${option==='b'&&!detail?`<h4 class="era-title">Present Day</h4><div class="board-grid">${['easy','medium','hard'].map(mini).join('')}</div><h4 class="era-title">Bombardment Era</h4><div class="mini bomb">${empty?'<p>No scores yet</p>':`<ol>${data.bomb.slice(0,3).map((r,i)=>`<li><span class="rank">${i+1}.</span><strong>${r[0]}</strong></li>`).join('')}</ol>`}<button data-pick="bomb">Stats →</button></div>`:board()}<footer class="footer"><span>Scores out of 100</span><button id="close">Close</button></footer>`;document.querySelectorAll('[data-era]').forEach(b=>b.onclick=()=>{era=b.dataset.era;all=false;render()});document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=b.dataset.level;all=false;render()});document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>pick(b.dataset.pick));if($('#back'))$('#back').onclick=()=>{detail=false;render()};if($('#history'))$('#history').onclick=()=>{all=!all;render()};if($('#close'))$('#close').onclick=()=>{closed=true;render()};if($('#reopen'))$('#reopen').onclick=enter;}
function enter(){closed=false;all=false;let from=$('#entry').value;detail=from!=='site';era=from==='bomb'?'bomb':'present';level='medium';render()};document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{option=b.dataset.option;enter()});$('#entry').onchange=enter;$('#empty').onchange=e=>{empty=e.target.checked;render()};render();
</script></body></html>
