<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASTRA · Records interaction study</title>
<style>
:root{color-scheme:dark;--bg:#0a121c;--panel:#111e29;--line:#30434e;--ink:#e4eae9;--muted:#a4b6bd;--gold:#e9ce94;--green:#adcabb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% 0,#263541 0,transparent 65%),var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif;min-height:100dvh}button,select{font:inherit}button{cursor:pointer;color:inherit;background:#1a2b35;border:1px solid var(--line);border-radius:8px;min-height:44px;padding:9px 15px}button:hover{background:#283c46;border-color:#829c9e}button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:3px}button[disabled]{opacity:.4;cursor:default}.quiet{background:transparent}.primary{background:var(--green);color:#102b29;border-color:var(--green)}.study{max-width:960px;margin:0 auto;padding:20px 24px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted)}.study strong{color:var(--gold);letter-spacing:.12em}.study span{text-align:right}main{max-width:960px;margin:auto;padding:0 24px 40px}.records{background:#101c27;border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 80px #0005;overflow:hidden}.heading{padding:22px 26px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}.heading h1{font-size:25px;letter-spacing:-.04em;margin:0;font-weight:550}.context{padding:0 26px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.context h2{font-size:16px;font-weight:450;margin:0}.context h2 span{color:var(--muted)}.context button{min-height:36px;padding:5px 10px;font-size:13px;color:var(--gold);background:transparent}.tabs{display:flex;gap:4px;padding:0 26px;border-bottom:1px solid var(--line)}.tabs button{background:transparent;border:0;border-radius:0;border-bottom:3px solid transparent;min-height:49px;padding:10px 19px;color:var(--muted)}.tabs button[aria-current=page]{border-color:var(--gold);color:var(--gold)}.body{padding:24px 26px 26px}.intro{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.intro h2{margin:0;font-size:19px;font-weight:500}.intro p{margin:0;color:var(--muted);font-size:12px}.boards{display:grid;grid-template-columns:1fr 1fr;gap:18px}.board{border:1px solid var(--line);border-radius:12px;padding:18px 18px 0;background:linear-gradient(140deg,#192a35,#121f29)}.board header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}.board h3{font-size:19px;font-weight:500;margin:0}.board header span{color:var(--muted);font-size:12px}.podium{list-style:none;padding:0;margin:0}.podium li{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:8px;padding:13px 0;border-bottom:1px solid #30434e88}.rank{font-size:13px;color:var(--muted)}.score{font-size:23px;font-weight:550;font-variant-numeric:tabular-nums;letter-spacing:-.03em;color:var(--gold)}.score small{font-size:11px;color:var(--muted);font-weight:400;letter-spacing:0}.podium time{font-size:12px;color:var(--muted)}.summary-stats{grid-column:2/-1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:0}.summary-stats div{display:grid;gap:1px}.summary-stats dt{font-size:10px;color:var(--muted)}.summary-stats dd{margin:0;font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink)}.podium li:first-child .rank{color:var(--gold)}.board>button{width:100%;border:0;border-radius:0;background:transparent;text-align:left;color:var(--green);padding:15px 0;min-height:54px}.empty{color:var(--muted);font-size:14px;padding:22px 0;min-height:140px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 18px;flex-wrap:wrap}.advanced{display:flex;align-items:center;gap:8px;font-size:13px;min-height:44px;cursor:pointer}.advanced input{width:17px;height:17px;accent-color:var(--green)}.table-scroll{overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}th{background:#172731;text-align:right;font-weight:450;color:var(--muted);font-size:12px}td,th{padding:13px 14px;border-bottom:1px solid #30434e88;text-align:right}th button{padding:0;min-height:30px;background:transparent!important;border:0;border-radius:0;color:inherit;font-size:inherit}td.points{color:var(--gold);font-weight:550}tbody tr:hover{background:#20333b}tr:last-child td{border-bottom:0}.count{font-size:12px;color:var(--muted);margin:12px 0 0}.scope-form{width:100%;display:flex;align-items:center;flex-wrap:wrap;gap:10px}.scope-title{display:grid;grid-template-columns:130px 16px minmax(160px,1fr);align-items:center;gap:8px;flex:1;min-width:0}.scope-title>span{color:var(--muted);text-align:center}select{width:100%;min-width:0;min-height:44px;background:#0d1c26;border:1px solid #617980;border-radius:7px;color:var(--ink);padding:8px;font-size:14px}.form-actions{display:flex;gap:8px}.form-actions button{min-height:44px}.form-actions .primary{background:var(--green);color:#102b29}.context-actions{display:flex;gap:8px;flex-wrap:wrap}.context .scope-heading{font:inherit;color:var(--ink);border:0;padding:0;text-align:left;border-radius:3px}.scope-heading:hover{text-decoration:underline;text-underline-offset:4px}.toolbar{justify-content:flex-end;margin-bottom:8px}.basic{table-layout:fixed}.expanded{table-layout:fixed;width:max-content;min-width:100%}td,th{text-align:center}.overall{border-right:2px solid #ac956688!important;background:#b79a4e09}tbody tr:nth-child(even){background:#172733}td.best{font-weight:700;color:#e6fff2;background:#38655355;box-shadow:inset 0 -2px #8bc9aa}td.points{font-weight:400;color:#e5d3a5}td.points.best{font-weight:800;color:#ffe9a8;background:#9e7b324d;box-shadow:inset 0 -3px #efca72}.summary-stats .best{background:#38655355;border-radius:3px;padding:2px 4px;box-shadow:inset 0 -2px #8bc9aa}.score.best{background:#9e7b324d;border-radius:4px;padding:2px 6px;width:max-content;max-width:100%;box-shadow:inset 0 -2px #efca72}
.destination{text-align:center;padding:65px 24px;border:1px solid var(--line);border-radius:18px;background:#101c27}.destination h1{font-size:25px;font-weight:500}.destination p{color:var(--muted)}.demo-options{margin:20px 2px 0;color:var(--muted);font-size:12px}.demo-options summary{cursor:pointer;min-height:40px;padding:10px 0}.demo-options>div{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.demo-options select{width:auto;font-size:12px}.status{position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden}[hidden]{display:none!important}@media(max-width:600px){.study{padding:14px 14px 12px}.study span{font-size:11px}main{padding:0 10px 24px}.heading{padding:16px 16px 10px}.context{padding:0 16px 16px;gap:7px}.context h2{font-size:15px}.tabs{padding:0 10px}.tabs button{flex:1;padding:10px}.body{padding:18px 14px}.boards{grid-template-columns:1fr;gap:14px}.board{padding:14px 16px 0}.podium li{padding:9px 0}.score{font-size:21px}.intro{margin-bottom:12px}.intro p{font-size:11px}.scope-title{flex-basis:100%;grid-template-columns:105px 12px minmax(0,1fr);gap:6px}.form-actions{margin-left:auto}.toolbar{gap:5px;margin-bottom:10px}td,th{padding:11px 7px}table{font-size:12px}th{font-size:11px}.advanced{font-size:12px}.heading h1{font-size:23px}}@media(max-height:440px) and (min-width:601px){.study{padding-top:8px}.heading{padding-top:12px}.body{padding-top:15px}.context{padding-bottom:12px}}
</style></head><body><div class="study"><strong>ASTRA</strong><span>Interactive mockup · example records</span></div><main><section class="records" aria-label="Records"></section><section class="destination" hidden><p>Mercury</p><h1>Caloris Basin</h1><button class="primary" id="open">Records</button></section><details class="demo-options"><summary>Try sample states</summary><div><label for="sample">Saved records</label><select id="sample"><option value="full">Full history</option><option value="few">Only two Lander flights</option><option value="empty">No records yet</option></select><button class="quiet" id="reset">Reset demo</button></div></details><p class="status" role="status" aria-live="polite"></p></main>
<script>
const worlds={mercury:['Caloris Basin','Hollows Terrace'],venus:['Venera Plains','Maat Mons'],earth:['Grand Canyon','Mount Mitchell','Victoria Falls'],moon:['Tranquility Base','Shackleton Connecting Ridge'],mars:['Olympus Mons · Caldera Rim','Valles Marineris · Melas Chasma','Jezero · Kodiak Overlook','Gale · Mount Sharp']};
const name=w=>w==='all'?'All planets':w[0].toUpperCase()+w.slice(1);let world='mercury',site='Caloris Basin',game='overview',advanced=false,edit=false,draftWorld=world,draftSite=site,sample='full',sort='score',asc=false;
const inherited={world:'mercury',site:'Caloris Basin'};
const root=document.querySelector('.records');const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');
const history=[];Object.entries(worlds).forEach(([w,sites],wi)=>sites.forEach((s,si)=>['lander','collector'].forEach((g,gi)=>[96.8,93.4,89.7,87.2,85.9,81.6,76.3,68.4].forEach((score,i)=>history.push({world:w,site:s,game:g,score:+(score-wi*.4-si*.7-gi*1.2).toFixed(1),time:+((g==='lander'?24:74)+[2.4,0,7.2,4.8,9.6,12,14.4,16.8][i]+si*3).toFixed(1),fuel:+(84.2-[3.1,6.2,0,9.3,12.4,15.5,18.6,21.7][i]-gi*12).toFixed(1),speed:+(.36+[.12,.24,.36,0,.48,0,.6,.72][i]).toFixed(2),at:Date.UTC(2026,9,13-[2,0,6,1,4,3,7,5][i],15+i,12),power:[2+(i%2),3,3+(i%2)],turn:3,collectorTurn:2+(i%2)})))));
const date=r=>new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',timeZone:'UTC'}).format(r.at);const fullDate=r=>date(r)+' · '+new Intl.DateTimeFormat('en-US',{hour:'numeric',minute:'2-digit',timeZone:'UTC'}).format(r.at);
function rows(g){return history.filter(r=>r.game===g&&(world==='all'||r.world===world)&&(site==='all'||r.site===site)&&(sample==='full'||sample==='few'&&g==='lander'&&r.at>=Date.UTC(2026,9,12))).filter(()=>sample!=='empty')}
function context(){
 if(edit)return `<form class="scope-form"><div class="scope-title"><select id="planet" aria-label="Planet">${['all',...Object.keys(worlds)].map(w=>`<option value="${w}" ${w===draftWorld?'selected':''}>${name(w)}</option>`).join('')}</select><span aria-hidden="true">—</span><select id="site" aria-label="Site">${['all',...(worlds[draftWorld]||[])].map(s=>`<option value="${esc(s)}" ${s===draftSite?'selected':''}>${s==='all'?'All sites':esc(s)}</option>`).join('')}</select></div><div class="form-actions"><button type="button" data-action="cancel">Cancel</button><button class="primary" type="submit">Confirm</button></div></form>`;
 return `<h2><button class="scope-heading" data-action="title" aria-label="Change destination: ${name(world)} — ${esc(site==='all'?'All sites':site)}">${name(world)} <span>—</span> ${esc(site==='all'?'All sites':site)}</button></h2><div class="context-actions"><button data-action="change">Change</button>${world!==inherited.world||site!==inherited.site?`<button data-action="restore">Restore to ${inherited.site}</button>`:''}</div>`;
}
function best(r,k){if(!['score','time','fuel','speed'].includes(k))return false;const group=rows(r.game).filter(x=>x.world===r.world&&x.site===r.site);return r[k]===Math[['score','fuel'].includes(k)?'max':'min'](...group.map(x=>x[k]));}
function board(g){const list=rows(g).sort((a,b)=>b.score-a.score).slice(0,3);return `<section class="board"><header><h3>${name(g)}</h3><span>Top 3</span></header>${list.length?`<ol class="podium">${list.map((r,i)=>`<li><span class="rank">${i+1}</span><span class="score ${best(r,'score')?'best':''}">${r.score.toFixed(1)} <small>/100</small>${site==='all'?`<small style="display:block">${esc(r.site)}</small>`:''}</span><time>${date(r)}</time><dl class="summary-stats"><div><dt>Time</dt><dd class="${best(r,'time')?'best':''}">${r.time.toFixed(1)} s</dd></div><div><dt>Fuel</dt><dd class="${best(r,'fuel')?'best':''}">${r.fuel.toFixed(1)}%</dd></div><div><dt>Touchdown</dt><dd class="${best(r,'speed')?'best':''}">${r.speed.toFixed(2)} m/s</dd></div></dl></li>`).join('')}</ol>`:`<div class="empty">No ${name(g)} records yet.</div>`}<button data-game="${g}">View ${name(g)} records <span aria-hidden="true">→</span></button></section>`}
function table(){const list=rows(game).sort((a,b)=>{const av=Array.isArray(a[sort])?a[sort].join(''):a[sort],bv=Array.isArray(b[sort])?b[sort].join(''):b[sort];return (typeof av==='string'?av.localeCompare(bv):av-bv)*(asc?1:-1)});
 const columns=[['score','Overall'],['time','Time'],['fuel','Fuel'],['speed','Touchdown']];if(advanced)columns.push(['at','Completed'],['power','Power · Lo / Med / Collect'],['turn','Rotation · Lander'],['collectorTurn','Rotation · Collector']);if(site==='all')columns.unshift(['site','Site']);if(world==='all')columns.unshift(['world','Planet']);const compact=!advanced&&site!=='all';
 return `${list.length?`<div class="table-scroll" tabindex="0" aria-label="${name(game)} records"><table class="${compact?'basic':'expanded'}"><colgroup>${columns.map(([k])=>`<col style="width:${compact?'25%':['score','time','fuel','speed'].includes(k)?'110px':k==='site'||k==='power'?'210px':'170px'}">`).join('')}</colgroup><thead><tr>${columns.map(([k,l])=>`<th scope="col" class="${k==='score'?'overall':''}" ${sort===k?`aria-sort="${asc?'ascending':'descending'}"`:''}><button data-sort="${k}">${l}${sort===k?(asc?' ↑':' ↓'):''}</button></th>`).join('')}</tr></thead><tbody>${list.map(r=>`<tr>${columns.map(([k])=>`<td class="${k==='score'?'points overall ':''}${best(r,k)?'best':''}" ${best(r,k)?`aria-label="${k==='score'?'Overall':k==='speed'?'Touchdown':name(k)} personal best: ${r[k]}"`:''}>${k==='at'?fullDate(r):k==='power'?r.power.join(' / '):k==='turn'||k==='collectorTurn'?r[k]+' / 5':k==='world'?name(r[k]):k==='score'?r[k].toFixed(1):k==='time'?r[k].toFixed(1)+' s':k==='fuel'?r[k].toFixed(1)+'%':k==='speed'?r[k].toFixed(2)+' m/s':esc(r[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="count">${list.length} saved flights${advanced?' · Tuning shown on the 1–5 scale':''}</p>`:`<p class="empty">No ${name(game)} records saved here yet.</p>`}`;
}
function render(focus){root.innerHTML=`<header class="heading"><h1>Records</h1><button class="quiet" data-action="close">Close</button></header><div class="context">${context()}</div><nav class="tabs" aria-label="Records view">${['overview','lander','collector'].map(g=>`<button data-game="${g}" ${game===g?'aria-current="page"':''}>${name(g)}</button>`).join('')}</nav><div class="body"><div class="intro"><h2>${game==='overview'?'Your top scores':name(game)+' records'}</h2>${game!=='overview'?`<label class="advanced"><input id="advanced" type="checkbox" ${advanced?'checked':''}>Advanced stats</label>`:''}</div>${game==='overview'?`<div class="boards">${board('lander')}${board('collector')}</div>`:table()}</div>`;root.querySelectorAll('[data-action=change],[data-action=title]').forEach(b=>b.onclick=()=>{edit=true;draftWorld=world;draftSite=site;render('#planet')});const restore=root.querySelector('[data-action=restore]');if(restore)restore.onclick=()=>{world=inherited.world;site=inherited.site;edit=false;render('[data-action=change]')};root.querySelector('[data-action=close]').onclick=close;root.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>{game=b.dataset.game;sort='score';asc=false;render(`.tabs [data-game=${game}]`)});if(edit){root.querySelector('#planet').onchange=e=>{draftWorld=e.target.value;draftSite='all';render('#planet')};root.querySelector('#site').onchange=e=>draftSite=e.target.value;root.querySelector('[data-action=cancel]').onclick=()=>{edit=false;render('[data-action=change]')};root.querySelector('form').onsubmit=e=>{e.preventDefault();world=draftWorld;site=draftSite;edit=false;render('[data-action=change]');document.querySelector('.status').textContent=`Showing ${name(world)}, ${site==='all'?'all sites':site}`};}root.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{const k=b.dataset.sort;asc=sort===k?!asc:['time','speed','site','world'].includes(k);sort=k;render(`[data-sort=${k}]`)});const a=root.querySelector('#advanced');if(a)a.onchange=()=>{advanced=a.checked;render('#advanced')};if(focus)root.querySelector(focus)?.focus({preventScroll:true})}
function close(){edit=false;root.hidden=true;const d=document.querySelector('.destination');d.hidden=false;d.querySelector('p').textContent=name(inherited.world);d.querySelector('h1').textContent=inherited.site;document.querySelector('#open').focus()}
document.querySelector('#open').onclick=()=>{world=inherited.world;site=inherited.site;root.hidden=false;document.querySelector('.destination').hidden=true;game='overview';render('[data-game=overview]')};document.querySelector('#sample').onchange=e=>{sample=e.target.value;render()};document.querySelector('#reset').onclick=()=>{world='mercury';site='Caloris Basin';game='overview';sort='score';asc=false;advanced=false;edit=false;sample='full';document.querySelector('#sample').value='full';root.hidden=false;document.querySelector('.destination').hidden=true;render()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!root.hidden){e.preventDefault();if(edit){edit=false;render('[data-action=change]')}else if(game!=='overview'){game='overview';render('[data-game=overview]')}else close()}});render();
</script></body></html>
