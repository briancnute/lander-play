 .mini b{font-size:13px;font-weight:650;white-space:nowrap}.c .mini i{font-style:normal;color:#c2c4bd;font-weight:400}.c .key{font-size:9px;color:#e3d4bb;letter-spacing:.06em;margin-top:3px}.back{height:100%;padding:16px;display:flex;flex-direction:column;background:#f1eadb}.back h2{font-size:18px;margin:0;padding:0 0 12px;border-bottom:1px solid #b5a88c}.back-body{display:grid;grid-template-columns:1.08fr 1fr;gap:22px;flex:1;min-height:0;overflow:auto;padding-top:14px}.back table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}.back th,.back td{padding:7px 4px;border-bottom:1px solid #d0c5ac;text-align:right}.back th:first-child{text-align:left}.back .overall{background:#e5d7b8;font-weight:750}.back .site{font-size:10px;letter-spacing:.05em;margin:0 0 10px}.back .fact{border-left:1px solid #b5a88c;padding-left:22px}.back h3{font-size:15px;margin:0 0 10px}.back p{font-size:14px;line-height:1.5}.back a{display:inline-block;font-size:11px;color:#795c45;min-height:40px;padding-top:8px}.back .records{margin-top:12px;background:none;color:#86483c;border:1px solid #9a6c58;border-radius:5px;min-height:40px;padding:6px 12px;font-size:11px;letter-spacing:.08em}.back-flip{display:flex;justify-content:flex-end;flex:none;min-height:44px;align-items:center}.back-flip button{background:none;border:0;color:#315d62;min-height:44px;padding:8px;font-size:12px}.mission-footer{flex:none;border-top:1px solid #b5a88c;text-align:center;padding:10px 0 0;font-size:10px;color:#65716f}.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin-top:5px}.actions button{min-height:56px;border:1px solid #778b8d;border-radius:6px;background:#26363f;color:#eef1e8;font-size:11px;padding:5px}.actions button:first-child{background:#ead09a;color:#302720}.actions button:nth-child(2){background:#194d49}.actions button:nth-child(3){background:#393052}.actions small{display:block;font-size:9px;margin-top:4px}[hidden]{display:none!important}.study- @media(max-width:600px){header.review{gap:6px;margin-top:8px}.review strong{width:100%;font-size:13px}.review button{padding:6px 10px}.card{height:min(604px,calc(100dvh - 190px))}.caption{padding-top:14px}.caption .greeting{font-size:18px}.caption h1{font-size:27px}.a .box{left:14px;bottom:8px;width:min(270px,calc(100% - 92px))}.a .box table{font-size:12px}.a .box td,.a .box th{padding-inline:4px}.a .box .overall td:nth-child(2){font-size:28px}.a .gap{font-size:11px}.a .box .links{display:block}.a .text-button{min-height:40px}.b .box{left:12px;right:12px}.b .box td,.b .box th{padding-inline:3px}.b .box th:first-child,.b .box td:first-child{width:47px;font-size:9px}.b .box .this td{font-size:13px}.b .box .this td:nth-child(2){font-size:25px}.b .box .best td{font-size:12px}.b .box th{font-size:9px;letter-spacing:0}.c .box{left:14px;width:calc(100% - 28px)}.c .links{padding-right:80px}.c .scoreline strong{font-size:36px}.back{padding:14px}.back-body{grid-template-columns:1fr;grid-auto-rows:max-content;gap:16px}.back .fact{border-left:0;border-top:1px solid #b5a88c;padding:12px 0 0}.back h2{font-size:16px}.back table{font-size:12px}.back p{font-size:13px}.back th,.back td{padding:5px 4px}.mission-footer{padding-top:8px;font-size:10px}.note{font-size:11px}}
body.sheet{padding:20px}.sheet header.review,.sheet .note,.sheet .actions{display:none}.sheet #stage{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.sheet .wrap{width:100%;margin:0;padding:0;background:none;border:0}.sheet .study-title{display:block;margin:0 0 10px;font-size:18px;color:#ecdfc2}.sheet .card{height:360px;min-height:0}.sheet .caption h1{font-size:26px}.sheet .greeting{font-size:18px}.sheet .a .box{width:250px;left:12px;bottom:8px}.sheet .a .box table{font-size:12px}.sheet .a .box td,.sheet .a .box th{padding-top:2px;padding-bottom:2px}.sheet .b .box .this td{font-size:14px}.sheet .b .box th{font-size:9px}.sheet .b .box .this td:nth-child(2){font-size:27px}.sheet .c .scoreline strong{font-size:34px}.sheet .c .box{left:12px;bottom:8px}.sheet .caption{padding-top:12px}.sheet .back{font-size:12px}.sheet.phone #stage{grid-template-columns:repeat(3,390px)}.sheet.phone .card{height:620px}.sheet.phone .caption h1{font-size:27px}.sheet.phone .back-body{grid-template-columns:1fr}.sheet.phone .back .fact{border-left:0;border-top:1px solid #b5a88c;padding:12px 0 0}

<header class="review"><strong>Postcard front studies</strong><button data-choice="a">A · Corner score</button><button data-choice="b">B · Bottom strip</button><button data-choice="c">C · Smallest overlay</button><button id="back">Back / footer</button></header><main id="stage"></main><p class="note">Design preview · Actual Caloris mission image; illustrative comparison values. Same photo and title in all three. Tap Flip to inspect the footer.</p>
<script>
const metrics=`<thead><tr><th></th><th>This run</th><th>Best run</th></tr></thead><tbody><tr class="overall"><td>Score</td><td>88.6</td><td>86.8</td></tr><tr><td>Time</td><td>25.0 s</td><td>27.0 s</td></tr><tr><td>Fuel</td><td>82.0%</td><td>79.0%</td></tr><tr><td>Touchdown</td><td>0.50 m/s</td><td>0.60 m/s</td></tr></tbody>`;
const box={a:`<table>${metrics}</table><div class="links"><span class="gap">New best · +1.8 · B</span><button class="text-button">Records →</button></div>`,b:`<div class="gap-line"><b>B · SILVER</b><span class="gap">New best · +1.8</span></div><table><thead><tr><th></th><th>Score</th><th>Time</th><th>Fuel</th><th>Touchdown</th></tr></thead><tbody><tr class="this"><td>This run</td><td>88.6</td><td>25.0 s</td><td>82.0%</td><td>0.50 m/s</td></tr><tr class="best"><td>Best run</td><td>86.8</td><td>27.0 s</td><td>79.0%</td><td>0.60 m/s</td></tr></tbody></table><div class="links"><button class="text-button">Records →</button></div>`,c:`<div class="scoreline"><strong>88.6</strong><small>POINTS</small><span class="bestscore">Best 86.8</span></div><div class="gap">New best · +1.8 <span style="color:#ddd2bd;font-weight:400"> · B · Silver</span></div><div class="mini"><div><span>Time</span><b>25.0 <i>/ 27.0 s</i></b></div><div><span>Fuel</span><b>82.0 <i>/ 79.0%</i></b></div><div><span>Touchdown</span><b>0.50 <i>/ 0.60</i></b></div></div><div class="key">THIS RUN / BEST RUN · TOUCHDOWN IN m/s</div><div class="links"><button class="text-button">Records →</button></div>`};
const names={a:'A · Corner box score',b:'B · Bottom score strip',c:'C · Smallest overlay'};
function card(which){return `<section class="wrap ${which}"><h2 class="study-title">${names[which]}</h2><div class="card"><div class="front"><img class="photo" src="mission.png" alt="Caloris Basin mission photograph"><div class="caption"><div class="greeting">Greetings from</div><h1>CALORIS BASIN</h1><small>LANDER</small></div><div class="box">${box[which]}</div><button class="flip" data-flip>⇄ &nbsp;Flip</button></div><div class="back" hidden><h2>Mercury — Caloris Basin</h2><div class="back-body"><section><p class="site">CALORIS BASIN · LANDER</p><table>${metrics}</table><button class="records">RECORDS →</button></section><section class="fact"><h3>Did you know?</h3><p>Ancient lava flooded much of Caloris after the basin formed. The broad plains inside the basin preserve a later chapter of Mercury’s volcanic history.</p><a href="https://science.nasa.gov/mercury/" target="_blank" rel="noopener">Learn more ↗</a></section></div><div class="back-flip"><button data-flip>⇄ &nbsp;Flip</button></div><footer class="mission-footer">Astra · 2026-10-19 16:37:00 UTC</footer></div></div><div class="actions"><button>Try again</button><button>Play Collector<small>Best —</small></button><button>Edit craft</button><button>Exit to Play</button></div></section>`;}
const q=new URLSearchParams(location.search),sheet=q.get('sheet'),stage=document.getElementById('stage');let selected=q.get('front')||'a';function render(){stage.innerHTML=sheet?['a','b','c'].map(card).join(''):card(selected);document.querySelectorAll('[data-choice]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.choice===selected)));if(q.get('side')==='back')flip(stage.querySelector('.wrap'));}function flip(w){const f=w.querySelector('.front'),b=w.querySelector('.back');f.hidden=!f.hidden;b.hidden=!b.hidden;}if(sheet)document.body.className='sheet'+(sheet==='phone'?' phone':'');document.addEventListener('click',e=>{const choice=e.target.closest('[data-choice]');if(choice){selected=choice.dataset.choice;render();}if(e.target.closest('[data-flip]'))flip(e.target.closest('.wrap'));if(e.target.closest('#back'))document.querySelectorAll('.wrap').forEach(w=>flip(w));});render();
</script></html>
