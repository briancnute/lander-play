<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASTRA · Hangar concept</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0b1219;color:#e6e9e9;--gold:#e8bd79;--line:#2d3a44}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,select,input{border:1px solid var(--line);border-radius:9px;background:#17232d;color:inherit;padding:12px}button{cursor:pointer;min-height:44px}button:hover{border-color:var(--gold)}button:disabled{opacity:.4;cursor:default}.primary{background:var(--gold);color:#16212b;font-weight:700;border-color:var(--gold)}.quiet{background:transparent}header{padding:22px 5%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:18px}.brand{letter-spacing:.28em;font-weight:800}.tag{color:#b7c2ca;font-size:12px;letter-spacing:.1em}main{max-width:1280px;margin:auto;padding:36px 5%}h1{font-size:clamp(30px,5vw,46px);font-weight:500;margin:8px 0}h2{font-weight:500}p{color:#aebdc8;line-height:1.6}.heading{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:18px}.card{background:#111d27;border:1px solid var(--line);border-radius:16px;overflow:hidden}.card.active{border-color:var(--gold)}.portrait{height:190px;background:radial-gradient(ellipse at 50% 80%,#293b48,transparent 70%);display:grid;place-items:center}.portrait svg{height:170px;width:200px}.card-body{padding:20px}.card h2{margin:6px 0 16px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{padding:9px 11px;font-size:13px}.eyebrow{font-size:11px;letter-spacing:.15em;color:var(--gold);text-transform:uppercase}.editor{display:grid;grid-template-columns:1.15fr 1fr;gap:32px}.stage{position:sticky;top:16px;align-self:start;border:1px solid var(--line);border-radius:18px;background:radial-gradient(ellipse at 50% 40%,#233642,#101a23 70%);overflow:hidden}.large{height:340px;display:grid;place-items:center}.large svg{width:90%;height:310px;touch-action:none}.scale{border-top:1px solid var(--line);padding:16px 22px;color:#aebdc8;display:flex;align-items:center;justify-content:space-between;gap:10px}.scale svg{width:65px;height:65px}.caption{padding:0 22px 18px;font-size:12px;color:#9aafbd}.panel{border-bottom:1px solid var(--line);padding:0 0 24px;margin-bottom:24px}.panel h2{font-size:18px;margin-top:0}label{display:block;margin:14px 0;color:#bcc9d2;font-size:14px}label input,label select{display:block;width:100%;margin-top:8px}.choices{display:flex;flex-wrap:wrap;gap:8px}.choices button[aria-pressed=true]{border-color:var(--gold);background:#354037}.swatch{width:48px;height:48px}.emoji button{font-size:25px}.sticky-actions{position:sticky;bottom:0;background:#0b1219ed;padding:16px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}#notice{min-height:24px;color:var(--gold);font-size:14px}dialog{max-width:640px;width:calc(100% - 32px);border:1px solid var(--line);border-radius:18px;background:#111d27;color:inherit;padding:28px}dialog::backdrop{background:#000b}.start-options{display:grid;gap:12px}.start-options button{text-align:left;padding:20px}.start-options b{display:block;font-size:19px;margin-bottom:5px}.start-options span{color:#aebdc8}.flight{height:340px;position:relative;overflow:hidden;border-radius:12px;background:radial-gradient(circle at 75% 20%,#52606b 0 15px,transparent 16px),linear-gradient(#101c30,#354556)}.ground{position:absolute;bottom:0;height:45px;width:100%;background:#555c62;border-top:2px solid #96a4ac}.demo-craft{position:absolute;width:64px;height:64px;left:calc(50% - 32px);bottom:45px;animation:float 5s ease-in-out infinite}.demo-craft svg{width:100%;height:100%}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-160px) rotate(-8deg)}}.danger{color:#f2a69b}footer{padding:24px 5%;color:#8196a5;font-size:12px;border-top:1px solid var(--line)}@media(max-width:700px){main{padding:22px 5%}.editor{grid-template-columns:1fr;gap:24px}.stage{position:relative;top:0}.large{height:250px}.large svg{height:235px}.heading{align-items:flex-start}.tag{font-size:10px}header{padding:18px 5%}}
</style><header><div class="brand">ASTRA <span style="font-weight:300;letter-spacing:.03em">/ HANGAR</span></div><a href="../../.." style="color:var(--gold);text-decoration:none;min-height:44px;display:flex;align-items:center;font-size:13px">← Back to ASTRA</a></header><div class="tag" style="padding:12px 5%;border-bottom:1px solid var(--line)">INTERACTIVE CONCEPT · SEPARATE FROM GAME</div><main id="app"></main><footer>Local concept collection · Saves only in this browser · Concept artwork, including Eagle and Car · Flight demo is illustrative</footer><dialog id="modal"></dialog><script>
const KEY='astra.hangar.concept.v1',DRAFT='astra.hangar.concept.draft.v1',app=document.querySelector('#app'),modal=document.querySelector('#modal');
const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2),copy=x=>JSON.parse(JSON.stringify(x));
const fresh=(kind='signature',model='Explorer')=>({id:uid(),kind,model,name:model,top:'Cabin',body:'Drum',legs:'Braced',engine:'Bell',paint:'#dfb87a',flame:'#86d9ed',emoji:'😎',stickers:[]});
let state={crafts:[fresh(),fresh('signature','Eagle'),{...fresh('emoji','Emoji'),name:'Good Company',emoji:'👻',paint:'#86b8ad'}],selected:null},draft,baseline,undo=[],selectedSticker=-1;
let storageWarning='';try{const stored=JSON.parse(localStorage.getItem(KEY));if(stored&&Array.isArray(stored.crafts)&&stored.crafts.length&&stored.crafts.every(c=>typeof c.id==='string'&&typeof c.name==='string'&&Array.isArray(c.stickers)))state=stored}catch{storageWarning='Saved collection could not be loaded. Your previous data has not been overwritten.'}state.selected ||=state.crafts[0].id;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function svg(c,big=false){let car=c.model==='Car',eagle=c.model==='Eagle',body=c.body==='Tank'?'<ellipse cx="150" cy="155" rx="43" ry="32"/>':c.body==='Cargo'?'<rect x="105" y="128" width="90" height="54" rx="5"/>':'<path d="M108 132L123 120H177L192 132V176L177 185H123L108 176Z"/>';if(c.model==='Expedition')body+='<rect x="88" y="132" width="16" height="48" rx="3"/><rect x="196" y="132" width="16" height="48" rx="3"/><path d="M117 115V66M183 115V66" stroke="#adbec6" stroke-width="5"/>';let top=c.top==='Dome'?'<path d="M119 120A31 35 0 0 1 181 120Z"/>':c.top==='Pod'?'<rect x="128" y="76" width="44" height="48" rx="20"/>':'<path d="M120 119V89L136 77H164L180 89V119Z"/>';
return `<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" ${big?'id="craft-svg" role="img" aria-label="Live craft preview; drag selected sticker on body"':''}><ellipse cx="150" cy="248" rx="72" ry="8" fill="#000" opacity=".25"/><g stroke="#1d2e3a" stroke-width="3" stroke-linejoin="round">${car?`<path d="M83 153L105 124H163L189 148H217V187H80Z" fill="${c.paint}"/><path d="M110 132H139V150H98Z" fill="#8cb8c5"/><circle cx="108" cy="187" r="18" fill="#26333b"/><circle cx="191" cy="187" r="18" fill="#26333b"/>`:`<g stroke="#a8b9c1" stroke-width="7"><path d="M116 166L${c.legs==='Skids'?97:83} 226M184 166L${c.legs==='Skids'?203:217} 226"/>${c.legs==='Braced'?'<path d="M113 184L83 226M187 184L217 226" stroke-width="3"/>':''}</g><path d="M${c.legs==='Skids'?79:70} 229H106M194 229H${c.legs==='Skids'?221:230}" stroke="${c.paint}" stroke-width="9"/><path d="M135 180L${c.engine==='Slim'?139:128} 208H${c.engine==='Slim'?161:172}L165 180Z" fill="#687d87"/>${big?`<path d="M139 209Q135 232 150 246Q165 230 161 209" fill="${c.flame}" stroke="none" opacity=".9"/>`:''}<g fill="${c.paint}">${c.kind==='emoji'?`<rect x="108" y="156" width="84" height="25" rx="7"/><text x="150" y="150" text-anchor="middle" font-size="91" stroke="none">${esc(c.emoji)}</text>`:body+`<g fill="${eagle?'#d7dce0':c.paint}">${top}</g><path d="M133 91H167V109H133Z" fill="#243c50"/><path d="M116 145H184M116 166H184" fill="none" opacity=".4"/>${eagle?'<path d="M104 145L87 126V174H105M196 145L213 126V174H195" fill="#d7dce0"/>':''}`}</g>`}</g>${c.stickers.map((s,i)=>`<g transform="translate(${s.x} ${s.y}) rotate(${s.rot})"><text data-sticker="${i}" x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="${s.size}" style="cursor:move">${esc(s.glyph)}</text>${big&&i===selectedSticker?`<rect x="${-s.size/2-3}" y="${-s.size/2-3}" width="${s.size+6}" height="${s.size+6}" rx="4" fill="none" stroke="#fff" stroke-dasharray="3 3"/>`:''}</g>`).join('')}</svg>`}
function persist(next){try{localStorage.setItem(KEY,JSON.stringify(next));state=next;storageWarning='';return true}catch{storageWarning='Could not save in this browser. Your previous saved collection is unchanged.';return false}}
function showModal(html){modal.innerHTML=html;modal.showModal()}function closeModal(){modal.close()}
function home(){draft=null;app.innerHTML=`<div class="heading"><div><div class="eyebrow">A craft that feels like yours</div><h1>My Craft</h1><p>Create it. Name it. Take it with you.</p></div><button class="primary" id="new">＋ Create craft</button></div><p id="notice" role="status">${esc(storageWarning)}</p><div class="grid">${state.crafts.map(c=>`<article class="card ${c.id===state.selected?'active':''}"><div class="portrait">${svg(c)}</div><div class="card-body"><div class="eyebrow">${c.id===state.selected?'Selected · ':''}${esc(c.kind==='modular'?'Your build':c.kind==='emoji'?'Emoji craft':c.model)}</div><h2>${esc(c.name)}</h2><div class="actions"><button class="primary" data-action="fly" data-id="${c.id}">Fly</button><button data-action="edit" data-id="${c.id}">Edit</button><button data-action="duplicate" data-id="${c.id}">Duplicate</button><button data-action="rename" data-id="${c.id}">Rename</button><button class="quiet" data-action="delete" data-id="${c.id}">Delete</button></div></div></article>`).join('')}</div>`;document.querySelector('#new').onclick=create;app.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action,b.dataset.id));}
function create(){showModal(`<div class="eyebrow">New craft</div><h2>Where would you like to start?</h2><div class="start-options"><button data-kind="signature"><b>Signature craft ↗</b><span>Explorer, Expedition, Eagle, or Car. Make one your own.</span></button><button data-kind="emoji"><b>Emoji craft ↗</b><span>A little character. A proper landing chassis.</span></button><button data-kind="modular"><b>Build your own ↗</b><span>A small kit of cabins, bodies, legs, and engines.</span></button></div><p><button onclick="closeModal()">Cancel</button></p>`);modal.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{closeModal();const c=fresh(b.dataset.kind,b.dataset.kind==='signature'?'Explorer':b.dataset.kind==='emoji'?'Emoji':'Custom');c.name=b.dataset.kind==='modular'?'My New Craft':b.dataset.kind==='emoji'?'Little Voyager':'My Explorer';edit(c)})}
function edit(c){draft=copy(c);baseline=JSON.stringify(draft);undo=[];selectedSticker=-1;editor();}
function stash(){try{localStorage.setItem(DRAFT,JSON.stringify({draft,baseline}))}catch{document.querySelector('#notice').textContent='Draft recovery unavailable. Keep this tab open until you save.'}}
function change(fn){undo.push(copy(draft));fn();stash();editor()}
function choice(label,key,values){return `<section class="panel"><h2>${label}</h2><div class="choices">${values.map(v=>`<button data-key="${key}" data-value="${esc(v)}" aria-pressed="${draft[key]===v}">${esc(v)}</button>`).join('')}</div></section>`}
function editor(){let s=draft.stickers[selectedSticker];app.innerHTML=`<div class="heading"><div><div class="eyebrow">Craft workshop</div><h1>${esc(draft.name)}</h1></div><button id="back">← My Craft</button></div><div class="editor"><div class="stage"><div class="large">${svg(draft,true)}</div><div class="scale"><span>At flight scale</span>${svg(draft)}</div><div class="caption">Concept artwork · Fixed foot contacts · Cosmetic parts only${draft.model==='Car'?' · Car is Earth / Lander only':''}</div></div><div><section class="panel"><label>Craft name<input id="name" maxlength="32" value="${esc(draft.name)}"></label></section>${draft.kind==='signature'?choice('Signature design','model',['Explorer','Expedition','Eagle','Car']):draft.kind==='emoji'?`<section class="panel"><h2>Choose your character</h2><div class="choices emoji">${['😎','😀','🤖','👽','👻','😺','🐸','🦊','🎃','🫠','🐼','🦉'].map(e=>`<button data-key="emoji" data-value="${e}" aria-pressed="${draft.emoji===e}">${e}</button>`).join('')}</div></section>`:choice('Cabin','top',['Cabin','Pod','Dome'])+choice('Main body','body',['Drum','Tank','Cargo'])}${draft.kind!=='signature'?choice('Landing gear','legs',['Braced','Straight','Skids'])+choice('Engine appearance','engine',['Bell','Slim']):''}<section class="panel"><h2>Coordinated paint</h2><div class="choices">${['#dfb87a','#86b8ad','#d9dfe3','#dc897c','#93a9da'].map((p,i)=>`<button class="swatch" style="background:${p}" aria-label="${['Gold','Sea glass','Ivory','Coral','Periwinkle'][i]} paint" data-key="paint" data-value="${p}" aria-pressed="${draft.paint===p}">${draft.paint===p?'✓':''}</button>`).join('')}</div></section>${choice('Flame color','flame',['#86d9ed','#ffc878','#d3a6f4']).replaceAll('>#86d9ed<','>Ice<').replaceAll('>#ffc878<','>Solar<').replaceAll('>#d3a6f4<','>Violet<')}<section class="panel"><h2>Stickers <small style="color:#8fa1af">${draft.stickers.length}/6</small></h2><p>Pick a sticker, then drag it on the body. Size and rotation stay within the surface.</p><div class="choices emoji">${['⭐','⚡','❤️','🌙','🚀','🌈'].map(e=>`<button data-add="${e}" ${draft.stickers.length>=6?'disabled':''}>${e}</button>`).join('')}</div>${draft.stickers.length?`<label>Selected sticker<select id="sticker">${draft.stickers.map((x,i)=>`<option value="${i}" ${i===selectedSticker?'selected':''}>${i+1} · ${esc(x.glyph)}</option>`).join('')}</select></label>`:''}${s?`<label>Size<input type="range" id="size" min="12" max="30" value="${s.size}"></label><label>Rotation<input type="range" id="rot" min="-180" max="180" value="${s.rot}"></label><button id="remove">Remove sticker</button>`:''}</section><p id="notice" role="status">${esc(storageWarning)}</p><div class="sticky-actions"><button class="primary" id="save">Save craft</button><button id="undo" ${undo.length?'':'disabled'}>Undo</button><button id="cancel">Cancel</button><span class="tag">${JSON.stringify(draft)===baseline?'SAVED DESIGN':'UNSAVED DRAFT'}</span></div></div></div>`;
app.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>change(()=>{draft[b.dataset.key]=b.dataset.value;draft.stickers.forEach(constrain)}));app.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>change(()=>{draft.stickers.push({glyph:b.dataset.add,x:150,y:155,size:20,rot:0});selectedSticker=draft.stickers.length-1}));document.querySelector('#name').oninput=e=>{draft.name=e.target.value;stash()};document.querySelector('#back').onclick=leave;document.querySelector('#cancel').onclick=leave;document.querySelector('#save').onclick=save;document.querySelector('#undo').onclick=()=>{draft=undo.pop();selectedSticker=-1;stash();editor()};if(document.querySelector('#sticker')){document.querySelector('#sticker').value=selectedSticker;document.querySelector('#sticker').onchange=e=>{selectedSticker=Number(e.target.value);editor()}}if(s){document.querySelector('#size').onchange=e=>change(()=>{s.size=Number(e.target.value);constrain(s)});document.querySelector('#rot').onchange=e=>change(()=>{s.rot=Number(e.target.value);constrain(s)});document.querySelector('#remove').onclick=()=>change(()=>{draft.stickers.splice(selectedSticker,1);selectedSticker=-1})}bindDrag();}
function constrain(s){let r=s.size*.72;s.x=Math.max(116+r,Math.min(184-r,s.x));s.y=Math.max(132+r,Math.min(178-r,s.y));}
function bindDrag(){const el=document.querySelector('#craft-svg');let dragging=false;el.onpointerdown=e=>{let hit=e.target.closest('[data-sticker]');if(hit){selectedSticker=Number(hit.dataset.sticker);editor();return}if(selectedSticker<0)return;undo.push(copy(draft));dragging=true;el.setPointerCapture(e.pointerId);move(e)};function move(e){if(!dragging)return;const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(el.getScreenCTM().inverse()),s=draft.stickers[selectedSticker];s.x=p.x;s.y=p.y;constrain(s);const group=el.querySelector(`[data-sticker="${selectedSticker}"]`).parentNode;group.setAttribute('transform',`translate(${s.x} ${s.y}) rotate(${s.rot})`)}el.onpointermove=move;el.onpointerup=()=>{if(dragging){dragging=false;stash();editor()}};el.onpointercancel=el.onpointerup;}
function clearDraft(){try{localStorage.removeItem(DRAFT)}catch{}}
function save(){draft.name=draft.name.trim()||'Untitled Craft';const next=copy(state),i=next.crafts.findIndex(c=>c.id===draft.id);if(i<0)next.crafts.push(copy(draft));else next.crafts[i]=copy(draft);if(persist(next)){clearDraft();home();document.querySelector('#notice').textContent='Craft saved. Ready when you are.'}else editor()}
function leave(){if(JSON.stringify(draft)===baseline){clearDraft();home();return}showModal('<h2>Keep your changes?</h2><p>Your saved craft is safe. Save this draft or discard the changes.</p><div class="actions"><button class="primary" id="keep">Save craft</button><button id="discard">Discard changes</button><button onclick="closeModal()">Keep editing</button></div>');modal.querySelector('#keep').onclick=()=>{closeModal();save()};modal.querySelector('#discard').onclick=()=>{closeModal();clearDraft();home()}}
function action(a,id){const c=state.crafts.find(c=>c.id===id);if(a==='edit')return edit(c);if(a==='duplicate'){const next=copy(state),d=copy(c);d.id=uid();let n=2;while(next.crafts.some(x=>x.name===`${c.name} ${n}`))n++;d.name=`${c.name} ${n}`;next.crafts.push(d);persist(next);home()}if(a==='rename'){showModal(`<h2>Rename craft</h2><label>Name<input id="rename" maxlength="32" value="${esc(c.name)}"></label><div class="actions"><button class="primary" id="commit">Save name</button><button onclick="closeModal()">Cancel</button></div>`);modal.querySelector('#commit').onclick=()=>{const next=copy(state);next.crafts.find(x=>x.id===id).name=modal.querySelector('#rename').value.trim()||c.name;persist(next);closeModal();home()}}if(a==='delete'){showModal(`<h2>Delete ${esc(c.name)}?</h2><p>${state.crafts.length===1?'Keep at least one craft in your collection.':'This removes this prototype design from your browser.'}</p><div class="actions"><button id="confirm-delete" class="danger" ${state.crafts.length===1?'disabled':''}>Delete craft</button><button onclick="closeModal()">Keep craft</button></div>`);modal.querySelector('#confirm-delete').onclick=()=>{const next=copy(state);next.crafts=next.crafts.filter(x=>x.id!==id);if(next.selected===id)next.selected=next.crafts[0].id;persist(next);closeModal();home()}}if(a==='fly')flight(c)}
function flight(c){showModal(`<div class="eyebrow">Flight-scale demonstration</div><h2>${esc(c.name)}</h2><p>Review silhouette and identity in motion. This is an animation, not ASTRA flight physics.</p><div class="actions"><label>World<select id="world"><option>Moon</option><option>Mars</option><option>Earth</option><option>Mercury</option><option>Venus</option><option>Pluto</option></select></label><label>Activity<select id="activity"><option>Lander</option><option>Collector</option></select></label></div><div class="flight"><div class="demo-craft">${svg(c)}</div><div class="ground"></div></div><p id="availability"></p><div class="actions"><button class="primary" id="select-craft">Use this craft</button><button onclick="closeModal()">Return to Hangar</button></div>`);const world=modal.querySelector('#world'),activity=modal.querySelector('#activity'),update=()=>{let available=c.model!=='Car'||world.value==='Earth'&&activity.value==='Lander';modal.querySelector('#availability').textContent=available?'Same design · Handling settings stay separate':'Car is available for Earth Lander. Choose that combination to select it.';modal.querySelector('#select-craft').disabled=!available;modal.querySelector('.demo-craft').style.visibility=available?'visible':'hidden';modal.querySelector('.flight').style.background=world.value==='Mars'?'linear-gradient(#291c2c,#ac7560)':world.value==='Earth'?'linear-gradient(#203d56,#718c8c)':'linear-gradient(#101c30,#354556)';modal.querySelector('.ground').style.background=world.value==='Mars'?'#8d5947':'#555c62'};if(c.model==='Car')world.value='Earth';world.onchange=activity.onchange=update;update();modal.querySelector('#select-craft').onclick=()=>{const next=copy(state);next.selected=c.id;persist(next);closeModal();home()}}
window.addEventListener('beforeunload',e=>{if(draft&&JSON.stringify(draft)!==baseline){e.preventDefault();e.returnValue=''}});home();try{const saved=JSON.parse(localStorage.getItem(DRAFT));if(saved?.draft?.id&&Array.isArray(saved.draft.stickers)){showModal('<h2>Your workshop draft is here</h2><p>You left a design in progress. Pick up where you stopped?</p><div class="actions"><button class="primary" id="recover">Resume editing</button><button id="drop">Discard draft</button></div>');modal.querySelector('#recover').onclick=()=>{closeModal();draft=saved.draft;baseline=saved.baseline;editor()};modal.querySelector('#drop').onclick=()=>{clearDraft();closeModal()}}}catch{}
</script></html>
