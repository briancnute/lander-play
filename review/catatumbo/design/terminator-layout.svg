<svg xmlns="http://www.w3.org/2000/svg" width="640" height="680" viewBox="0 0 640 680" role="img" aria-labelledby="title desc">
<title id="title">Approved Terminator Zone layout</title><desc id="desc">A forward course on continuous gray terrain, with colder long-dark ground left and increasing solar exposure right. Three samples draw a left, right, center line between the start and finish. Small crater jumps are optional.</desc>
<defs><linearGradient id="ground"><stop stop-color="#303842"/><stop offset=".5" stop-color="#6b6b66"/><stop offset="1" stop-color="#8c8070"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#f4deb1"/></marker></defs>
<rect width="640" height="680" rx="16" fill="#111b24"/><g fill="#e8e6dd" font-family="system-ui,sans-serif" text-anchor="middle"><text x="320" y="34" font-size="22">Approved course layout</text><text x="320" y="59" font-size="13">Schematic · not a surveyed temperature map</text></g>
<rect x="30" y="86" width="580" height="512" rx="20" fill="url(#ground)"/>
<g fill="none" stroke="#a4a097" stroke-width="3" opacity=".65"><ellipse cx="209" cy="443" rx="25" ry="18"/><ellipse cx="378" cy="339" rx="30" ry="23"/><ellipse cx="285" cy="236" rx="29" ry="23"/><ellipse cx="405" cy="475" rx="20" ry="17"/><ellipse cx="280" cy="371" rx="18" ry="14"/><ellipse cx="163" cy="255" rx="21" ry="16"/><ellipse cx="420" cy="190" rx="23" ry="17"/><ellipse cx="322" cy="161" rx="14" ry="11"/></g>
<path d="M320 550 C300 520 220 525 207 491 S247 421 260 402 S410 403 397 362 S410 300 369 291 S320 247 320 210 L320 135" fill="none" stroke="#f4deb1" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<g fill="#f9d785" stroke="#473d2b" stroke-width="2"><path d="M207 480l9 11-9 11-9-11z"/><path d="M397 351l9 11-9 11-9-11z"/><path d="M320 199l9 11-9 11-9-11z"/></g>
<g fill="none" stroke="#c2e0e1" stroke-width="2"><path d="M209 470Q190 444 209 417M378 371Q355 339 378 307M285 268Q261 235 285 204" stroke-dasharray="3 3"/></g>
<g fill="#fff0d3" font-family="system-ui,sans-serif" font-size="14"><text x="238" y="494">1 · cool-side sample</text><text x="420" y="367">2 · sunward</text><text x="344" y="215">3 · center</text><text x="320" y="575" text-anchor="middle">START</text><text x="320" y="117" text-anchor="middle">FINISH</text><text x="67" y="125">Long-dark side</text><text x="65" y="148">Cooling risk ←</text><text x="451" y="125">Sunward side</text><text x="451" y="148">→ Heating risk</text></g>
<g fill="#d3dcde" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle"><text x="320" y="629">Continuous terrain · gradual thermal pressure · no visible wall</text><text x="320" y="653">Gold: forgiving sample route · pale arcs: optional low crater jumps</text></g></svg>
