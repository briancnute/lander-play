<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASTRA · Compact box score preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#091014;color:#fff2d1;font:14px/1.4 system-ui,sans-serif}.review{max-width:900px;margin:12px auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:0 6px}.review strong{margin-right:auto}.review select{color:#eee8d7;background:#1b3039;border:1px solid #5b777c;border-radius:5px;min-height:36px;padding:6px;font:inherit}.note{max-width:900px;margin:8px auto;padding:0 8px;color:#aebabb;font-size:11px}.wrap{width:min(900px,calc(100vw - 12px));margin:auto;padding:6px;border:1px solid #61757a99;border-radius:14px;background:#13232c}.card{position:relative;height:min(600px,calc(100dvh - 160px));min-height:300px;border:2px solid #d8ceb6;overflow:hidden;background:#111}.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.caption{position:absolute;inset:0 0 auto;padding:16px 14px 45px;text-align:center;background:linear-gradient(#02080ca6,transparent);text-shadow:0 2px 5px #000}.greeting{font:bold italic 22px/1.2 Georgia,serif}.caption h1{margin:3px 0 6px;font:900 italic clamp(25px,4vw,42px)/1.15 system-ui;letter-spacing:-.03em}.caption small{font-size:10px;letter-spacing:.2em}.shade{position:absolute;inset:auto 0 0;height:170px;background:linear-gradient(transparent,#02080cd9);pointer-events:none}.box{position:absolute;left:16px;bottom:14px;max-width:calc(100% - 108px);text-shadow:0 1px 3px #000}.score-table{width:max-content;border-collapse:collapse;table-layout:auto;font:13px/1.2 system-ui;font-variant-numeric:tabular-nums}.score-table th,.score-table td{text-align:left;white-space:nowrap;padding:3px 8px;font-weight:400}.score-table th:first-child{padding-left:0;padding-right:10px}.score-table thead{border-bottom:1px solid #fff4}.score-table thead th,.score-table tbody th{font-size:10px;font-weight:500;color:#e1d5bd}.score-table td:last-child,.score-table th:last-child{padding-right:0}.score-table .best td{color:#d1c9ba}.score-table .current .score .value{font-size:30px;font-weight:850;letter-spacing:-.025em;line-height:1.05}.score-table .better .value{font-weight:750}.score-table th small{display:block;font-size:8px;line-height:1.1;font-weight:400}.score-table .unit{font-size:inherit;font-weight:inherit}.score-table .score{border-right:1px solid #fff5;padding-right:13px}.score-table .fuel{padding-left:13px}.value{position:relative;display:inline-block}.star{position:absolute;top:-3px;right:-7px;color:#91dc91;font-size:7px;font-weight:400;line-height:1}.score-table td:has(.star){padding-right:13px}.flip{position:absolute;right:8px;bottom:8px;min-width:60px;min-height:44px;padding:8px 10px;border:0;border-radius:5px;background:#07181c88;color:#fff2d1;font:600 12px system-ui}.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin-top:5px}.actions button{min-height:56px;border:1px solid #778b8d;border-radius:6px;background:#26363f;color:#eef1e8;font:600 11px/1.2 system-ui;padding:5px}.actions button:first-child{background:#ead09a;color:#302720}.actions button:nth-child(2){background:#194d49}.actions button:nth-child(3){background:#393052}.actions small{display:block;font-size:9px;margin-top:4px}.narrow{display:none}
@media(max-width:600px){.review{margin:8px auto;font-size:12px}.review select{font-size:12px;min-height:32px}.card{height:min(604px,calc(100dvh - 175px))}.greeting{font-size:18px}.caption h1{font-size:27px}.box{left:12px;bottom:12px;max-width:calc(100% - 96px)}.score-table{font-size:12px}.score-table th,.score-table td{padding:3px 3px}.score-table th:first-child{padding-right:5px}.score-table .score{padding-right:7px}.score-table .fuel{padding-left:7px}.score-table .current .score .value{font-size:22px}.score-table thead th,.score-table tbody th{font-size:9px}.score-table td:has(.star){padding-right:8px}.note{font-size:10px}}
@media(max-width:360px){.wide{display:none}.narrow{display:table}.score-table{font-size:12px}.score-table .score{border-right:0;border-bottom:1px solid #fff5}.score-table .fuel{padding-left:4px}.score-table .current-score .value{font-size:22px;font-weight:850}.score-table th:first-child{font-size:10px;padding-right:10px}.score-table .best-value{color:#d1c9ba}.score-table thead th{font-size:9px}.score-table .score td,.score-table .score th{padding-bottom:6px}.score-table .time td,.score-table .time th{padding-top:6px}.box{max-width:calc(100% - 92px)}}
body.crop .review,body.crop .note,body.crop .actions,body.crop .caption{display:none}body.crop .wrap{border:0;border-radius:0;padding:0;width:100%}body.crop .card{height:190px;min-height:190px;border:0}body.crop .photo{object-position:center bottom}
</style>
<header class="review"><strong>Compact box score · preview</strong><label>Example <select id="example"><option value="mixed">Your laptop example</option><option value="phone">Your phone example</option><option value="tied">Tied subcategories</option><option value="first">First run</option><option value="all">All subcategories improved</option></select></label></header>
<main class="wrap"><div class="card"><img class="photo" src="../postcard-overlay/mission.png" alt="Caloris Basin mission photograph"><div class="caption"><div class="greeting">Greetings from</div><h1>CALORIS BASIN</h1><small>LANDER</small></div><div class="shade"></div><div class="box" id="score"></div><button class="flip">⇄ &nbsp;Flip</button></div><div class="actions"><button>Try again</button><button>Play Collector<small>Best 90.3</small></button><button>Edit craft</button><button>Exit to Play</button></div></main>
<p class="note">Design preview with your supplied comparison values. Bold subcategories beat this best run; green stars retain their separate all-time-record meaning. Production is unchanged.</p>
<script>
const examples={mixed:{current:[86.1,12.8,80,1.69],best:[92.2,13.3,77.7,.33],stars:[]},phone:{current:[85.8,12.3,82.1,1.91],best:[92.2,13.3,77.7,.33],stars:[2]},tied:{current:[90,13.3,77.7,.33],best:[92.2,13.3,77.7,.33],stars:[]},first:{current:[86.1,12.8,80,1.69],best:null,stars:[]},all:{current:[96.2,12.1,85,.2],best:[92.2,13.3,77.7,.33],stars:[0,3]}};
const order=[0,2,1,3],headings=['Score','Time ↓<small>(s)</small>','Fuel ↑<small>(%)</small>','Landing ↓<small>(m/s)</small>'];const names=['Score','Time','Fuel','Landing'],classes=['score','time','fuel','landing'],units=['',' s','%',' m/s'];const q=new URLSearchParams(location.search);if(q.has('crop'))document.body.classList.add('crop');
function better(x,i){return !!x.best&&(i===1||i===3?x.current[i]<x.best[i]:x.current[i]>x.best[i]);}
function number(v,i){return i===3?v.toFixed(2):String(Number(v.toFixed(1)));}
function value(x,i,current){const v=current?x.current[i]:x.best?.[i];return v==null?'—':`<span class="value">${number(v,i)}${current&&x.stars.includes(i)?`<span class="star" role="img" aria-label="New ${names[i].toLowerCase()} record">★</span>`:''}</span>`;}
function render(key){const x=examples[key]||examples.mixed;document.getElementById('example').value=key;document.getElementById('score').innerHTML=`<table class="score-table wide" aria-label="Current versus best"><thead><tr><th></th>${order.map(i=>`<th scope="col" class="${classes[i]}">${headings[i]}</th>`).join('')}</tr></thead><tbody>${[true,false].map(current=>`<tr class="${current?'current':'best'}"><th scope="row">${current?'Current':'Best'}</th>${order.map(i=>`<td data-metric="${classes[i]}" class="${classes[i]} ${current&&i>0&&better(x,i)?'better':''}">${value(x,i,current)}</td>`).join('')}</tr>`).join('')}</tbody></table><table class="score-table narrow" aria-label="Current versus best"><thead><tr><th></th><th>Current</th><th>Best</th></tr></thead><tbody>${order.map(i=>`<tr class="${classes[i]}"><th scope="row">${headings[i]}</th><td data-metric="${classes[i]}" class="${i===0?'current-score':better(x,i)?'better':''}">${value(x,i,true)}</td><td class="best-value">${value(x,i,false)}</td></tr>`).join('')}</tbody></table>`;}
document.getElementById('example').onchange=e=>render(e.target.value);render(q.get('example')||'mixed');
</script></html>
