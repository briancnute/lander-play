<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Venus failure screen draft</title><link rel="stylesheet" href="screen.css"><body><main aria-label="Flight ended"><section class="panel"><div class="story"><p class="eyebrow">THROUGH THE VEIL</p><h1>Flight ended.</h1><p class="cause">Lightning strike</p><p class="hint">Move clear of the warning before the bolt strikes.</p></div><div class="flight"><div class="stat"><strong>4 <span>/ 6</span></strong><span>Samples collected</span></div><div class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div><p class="time">Flight time <b>0:48</b></p></div><div class="actions"><button class="retry">Try again</button><div class="links"><button>Change craft</button><button>Back</button></div><p class="note">New flight · same craft and settings</p></div></section></main><output hidden></output><script>
const q=new URLSearchParams(location.search),size=q.get('size')||'desktop',option=q.get('option')||'a';document.body.dataset.option=option;document.body.style.backgroundImage=`url(scene-${size}.jpg)`;if(q.get('cause')==='fuel'){document.querySelector('.cause').textContent='Fuel exhausted';document.querySelector('.hint').textContent='Use shorter thrust bursts to conserve fuel.'}if(option==='before'){document.body.innerHTML=`<img class="before" alt="Current Venus failure screen" src="before-${size}.jpg">`}else{document.querySelectorAll('button').forEach(b=>b.onclick=()=>{const o=document.querySelector('output');o.hidden=false;o.textContent='Design preview — '+b.textContent;setTimeout(()=>o.hidden=true,1800)})}
</script></body></html>
